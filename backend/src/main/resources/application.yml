app:
  name: EcoSort
  version: 0.1.0
  jwt:
    secret: ${APP_JWT_SECRET:change-me-in-production-12345678901234567890}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}

server:
  port: 8080

spring:
  application:
    name: ${APP_NAME:ecosort-api}
  data:
    mongodb:
      uri: ${MONGODB_URI}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
