spring:
  config:
    activate:
      on-profile: test
  main:
    web-application-environment: servlet
  data:
    mongodb:
      uri: mongodb://localhost:27017/ecosort_test

app:
  jwt:
    secret: test-secret-for-unit-tests-only-1234567890

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    mongo:
      enabled: false
